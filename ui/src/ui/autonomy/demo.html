<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Autonomy Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
    }

    /* Polyfill for older browsers */
    :not(:defined) {
      visibility: hidden;
    }
  </style>
  <script type="module">
    // Importer les composants
    import "./autonomy-dashboard.js";
    import "./patterns-view.js";
    import "./goals-view.js";
    import "./knowledge-view.js";
    import "./decisions-view.js";
    import "./timeline-view.js";

    // Simuler des données
    document.addEventListener("DOMContentLoaded", () => {
      const dashboard = document.querySelector("autonomy-dashboard");
      if (dashboard) {
        dashboard.stats = {
          patternsLearned: 15,
          goalsInferred: 4,
          preferencesLearned: 8,
          knowledgeNodes: 42,
          decisionsMade: 128,
          learningProgress: 73,
        };
      }
    });
  </script>
</head>
<body>
  <autonomy-dashboard></autonomy-dashboard>
</body>
</html>
