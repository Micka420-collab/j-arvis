services:
  jarvis-gateway:
    image: ${JARVIS_IMAGE:-${OPENCLAW_IMAGE:-jarvis:local}}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${JARVIS_GATEWAY_TOKEN:-${OPENCLAW_GATEWAY_TOKEN}}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      # Domotique
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      TUYA_ACCESS_ID: ${TUYA_ACCESS_ID:-}
      TUYA_ACCESS_KEY: ${TUYA_ACCESS_KEY:-}
    volumes:
      - ${JARVIS_CONFIG_DIR:-${OPENCLAW_CONFIG_DIR:-~/.openclaw}}:/home/node/.openclaw
      - ${JARVIS_WORKSPACE_DIR:-${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}}:/home/node/.openclaw/workspace
    ports:
      - "${JARVIS_GATEWAY_PORT:-${OPENCLAW_GATEWAY_PORT:-18789}}:18789"
      - "${JARVIS_BRIDGE_PORT:-${OPENCLAW_BRIDGE_PORT:-18790}}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${JARVIS_GATEWAY_BIND:-${OPENCLAW_GATEWAY_BIND:-lan}}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  jarvis-cli:
    image: ${JARVIS_IMAGE:-${OPENCLAW_IMAGE:-jarvis:local}}
    network_mode: "service:jarvis-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${JARVIS_GATEWAY_TOKEN:-${OPENCLAW_GATEWAY_TOKEN}}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      BROWSER: echo
    volumes:
      - ${JARVIS_CONFIG_DIR:-${OPENCLAW_CONFIG_DIR:-~/.openclaw}}:/home/node/.openclaw
      - ${JARVIS_WORKSPACE_DIR:-${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - jarvis-gateway
